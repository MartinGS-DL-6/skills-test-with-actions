name: Python Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  python-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # use 3.13 only if you require it and it's available

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==8.4.1
          pip install coverage==7.9
          pip install pytest-cov==6.2.1

      - name: Run tests and generate coverage (XML + terminal)
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term

      - name: Coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70
          # By default it looks for "coverage.xml" at repo root; no need to set path if you keep the default.

      - name: Fail if below threshold
        run: coverage report --fail-under=``